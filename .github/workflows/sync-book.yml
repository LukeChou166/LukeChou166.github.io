name: Sync book subtree

on:
  # 由 claude-code-book 仓库 push 时通过 repository_dispatch 实时触发
  repository_dispatch:
    types: [book-update]
  # 兜底：每小时检查一次书源更新（未配置 PAT 时也能自动同步）
  schedule:
    - cron: '23 * * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync book content (mirror)
        id: sync
        run: |
          BEFORE=$(git rev-parse HEAD)
          # 002-knowledge-home 之后书籍位于 book/claude-code-book/。
          # git subtree 依赖的合并元数据在目录迁移后已失效（冲突被 || true 静默吞掉），
          # 故改为直接镜像书源仓库（research.md R3 降级方案）。
          git clone --depth 1 --branch main \
            https://github.com/LukeChou166/claude-code-book.git /tmp/book-src
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            /tmp/book-src/ book/claude-code-book/
          # 保留本仓库维护的 Docsify 阅读壳（书源无此文件，会被 --delete 清掉）
          git checkout HEAD -- book/claude-code-book/index.html
          git add book/claude-code-book
          if git diff --cached --quiet "$BEFORE" -- book/claude-code-book; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Book already up to date"
          else
            git commit -m "sync: update claude-code-book content"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Book updated: $BEFORE -> $(git rev-parse HEAD)"
          fi

      - name: Push
        if: steps.sync.outputs.changed == 'true'
        run: git push origin master
