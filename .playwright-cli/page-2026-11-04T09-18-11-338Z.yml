            - text: ：
            - code [ref=f1e212]: Tool.ts
            - text: 中
            - code [ref=f1e213]: ToolUseContext
            - text: 类型定义约 150 行，包含大量可选字段（
            - code [ref=f1e214]: "?:"
            - text: ），不同使用场景下部分字段会缺失。这种"隐式约定"（某些场景下某些字段必须存在）很难从类型系统中表达清楚，容易在新增使用场景时出错。
