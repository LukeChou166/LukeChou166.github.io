          - separator [ref=f6e211]
          - heading "项目概述" [level=2] [ref=f6e212]
          - paragraph [ref=f6e213]:
            - text: Claude Code 是 Anthropic 官方发布的 AI 编程助手 CLI 工具，其核心是一个
            - strong [ref=f6e214]: 客户端驱动的 Agentic Loop
            - text: ：
          - code [ref=f6e216]: 用户输入 → 构建 System Prompt → 调用 Claude API（流式） ↑ ↓ └── 工具执行结果 ←← AI 返回 tool_use 指令
          - paragraph [ref=f6e217]:
            - text: 它与 Copilot 式补全工具最大的区别在于：Claude Code 不只是"预测下一行代码"，而是真正地
            - strong [ref=f6e218]: 理解任务、规划步骤、执行操作、验证结果
            - text: ，形成完整的编程智能体。
