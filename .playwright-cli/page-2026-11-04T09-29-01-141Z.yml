          - heading "如何阅读本书" [level=2] [ref=f6e203]
          - paragraph [ref=f6e204]: 如果你是完全的初学者，建议按顺序从第1章读起。如果你对某个特定主题感兴趣，可以直接跳到对应章节——每章开头都会说明前置知识。
          - paragraph [ref=f6e205]: 本书大量引用代码片段，格式如下：
          - list [ref=f6e206]:
