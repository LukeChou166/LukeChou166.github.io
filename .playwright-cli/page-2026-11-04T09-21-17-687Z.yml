          - separator [ref=f3e82]
          - heading "1.1 解决什么问题" [level=2] [ref=f3e83]
          - paragraph [ref=f3e84]:
            - text: 在 Claude Code 出现之前，AI 辅助编程的主流形态是
            - strong [ref=f3e85]: 代码补全
            - text: （GitHub Copilot 等）：用户在 IDE 里写代码，AI 在光标处预测下一行。这种模式有天然的局限：
          - list [ref=f3e86]:
            - listitem [ref=f3e87]:
              - strong [ref=f3e88]: 单点感知
              - text: ：AI 只看到当前打开的几个文件，无法理解整个项目的依赖关系。
            - listitem [ref=f3e89]:
              - strong [ref=f3e90]: 无工具调用
              - text: ：AI 无法真正执行命令、读取文件、运行测试——它只能"预测文本"。
            - listitem [ref=f3e91]:
              - strong [ref=f3e92]: 无多轮交互
              - text: ：Copilot 式补全是一次性的，缺乏对话式推理能力。
            - listitem [ref=f3e93]:
              - strong [ref=f3e94]: 上下文窗口太小
              - text: ：早期 Copilot 只能感知约 512 个 token 的上下文，对于大型项目几乎无效。
          - paragraph [ref=f3e95]:
            - text: Claude Code 的目标是构建一个
            - strong [ref=f3e96]: 真正的编程智能体（Coding Agent）
            - text: ：它能读文件、写文件、执行 Shell、调用外部工具、跨会话记忆，并且在没有用户干预的情况下完成从"我要修这个 Bug"到"代码已经 commit 并且测试通过"的完整任务链。
          - separator [ref=f3e97]
          - heading "1.2 业界的做法" [level=2] [ref=f3e98]
          - paragraph [ref=f3e99]:
            - strong [ref=f3e100]: 代码补全派
            - text: （GitHub Copilot, Cursor Tab）：
          - list [ref=f3e101]:
            - listitem [ref=f3e102]: 优点：低延迟，适合"快速补全"场景
            - listitem [ref=f3e103]: 缺点：无任务规划能力，无法跨文件操作
          - paragraph [ref=f3e104]:
            - strong [ref=f3e105]: 对话助手派
            - text: （ChatGPT, Claude.ai 网页版）：
          - list [ref=f3e106]:
            - listitem [ref=f3e107]: 优点：可以多轮交互，可以"思考"
            - listitem [ref=f3e108]: 缺点：无法真正操作文件系统，只能输出代码片段让用户手动复制
          - paragraph [ref=f3e109]:
            - strong [ref=f3e110]: 早期 Agentic 工具
            - text: （AutoGPT, BabyAGI）：
          - list [ref=f3e111]:
            - listitem [ref=f3e112]: 优点：自主规划和执行
            - listitem [ref=f3e113]: 缺点：工程质量差，容易死循环，缺乏安全机制，对大代码库无能为力
          - paragraph [ref=f3e114]:
            - strong [ref=f3e115]: 竞争者
            - text: （Cursor Agent, Copilot Workspace）：
          - list [ref=f3e116]:
            - listitem [ref=f3e117]: 优点：集成在 IDE 中，有文件系统访问
            - listitem [ref=f3e118]: 缺点：闭源，可扩展性差，不支持自定义工具
          - separator [ref=f3e119]
          - heading "1.3 本项目的做法：四层架构" [level=2] [ref=f3e120]
          - paragraph [ref=f3e121]: 读完代码，可以归纳出一个清晰的四层架构：
          - code [ref=f3e123]: ┌─────────────────────────────────────────────────────────────┐ │ 第四层：用户界面 │ │ TUI (ink/React) │ SDK (QueryEngine API) │ CLI (print) │ ├─────────────────────────────────────────────────────────────┤ │ 第三层：会话管理 │ │ QueryEngine ←→ query.ts (主循环) │ ├─────────────────────────────────────────────────────────────┤ │ 第二层：工具与智能体 │ │ BashTool FileReadTool GrepTool AgentTool SkillTool MCP│ ├─────────────────────────────────────────────────────────────┤ │ 第一层：基础设施 │ │ Anthropic API │ 权限系统 │ 上下文管理 │ 存储 │ 分析/遥测 │ └─────────────────────────────────────────────────────────────┘
          - paragraph [ref=f3e124]: 每一层的核心职责：
          - table [ref=f3e125]:
            - rowgroup [ref=f3e126]:
              - row [ref=f3e127]:
                - columnheader "层级" [ref=f3e128]
