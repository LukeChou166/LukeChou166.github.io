          - separator [ref=f3e156]
          - heading "1.4 信息流：一次用户输入如何变成代码修改" [level=2] [ref=f3e157]
          - paragraph [ref=f3e158]:
            - text: 以用户输入
            - code [ref=f3e159]: "\"帮我修复 src/utils.ts 里的 bug\""
            - text: 为例，整个请求链路：
          - code [ref=f3e161]: "1. 用户按下回车 │ ▼ 2. main.tsx: processUserInput() │ 解析命令/普通消息 │ 判断是否是 /slash 命令 │ ▼ 3. QueryEngine.ts: processUserTurn() │ 构造 UserMessage │ 加载记忆文件（CLAUDE.md） │ 构建 systemPrompt │ ▼ 4. query.ts: query() → queryLoop() ← 核心 Agentic Loop │ │ ① 发送消息给 Claude API（流式） │ ② 接收 AI 回复（可能含 tool_use 块） │ ③ 执行工具： │ ├── FileReadTool(\"src/utils.ts\") → 读取文件内容 │ ├── GrepTool(\"error pattern\") → 搜索错误模式 │ └── FileEditTool(\"修复内容\") → 写入修复 │ ④ 把工具结果作为 tool_result 送回 AI │ ⑤ AI 决定：继续？还是任务完成？ │ ⑥ 如果继续，重新执行 ② │ ▼ 5. 流式输出到终端 / SDK"
          - separator [ref=f3e162]
          - heading "1.5 技术选型解读" [level=2] [ref=f3e163]
          - heading "TypeScript + Bun" [level=3] [ref=f3e164]
          - paragraph [ref=f3e165]:
            - text: Claude Code 用
            - link "Bun" [ref=f3e166] [cursor=pointer]:
              - /url: https://bun.sh/
            - text: 作为运行时和打包器，而不是传统的 Node.js + webpack/esbuild。
          - paragraph [ref=f3e167]: 代码里充斥着这样的写法：
          - code [ref=f3e169]: "// src/query.ts（第 15-20 行） const reactiveCompact = feature('REACTIVE_COMPACT') ? (require('./services/compact/reactiveCompact.js') as typeof import('./services/compact/reactiveCompact.js')) : null const contextCollapse = feature('CONTEXT_COLLAPSE') ? (require('./services/contextCollapse/index.js') as typeof import('./services/contextCollapse/index.js')) : null"
          - paragraph [ref=f3e170]:
            - code [ref=f3e171]: feature('FLAG')
            - text: 是 Bun 的
            - strong [ref=f3e172]: Dead-Code Elimination (DCE)
            - text: 特性：在编译时，如果
            - code [ref=f3e173]: FLAG
            - text: 为
            - code [ref=f3e174]: "false"
            - text: ，整个三元表达式的 false 分支会被从打包产物中删除，就像 C 语言的
            - code [ref=f3e175]: "#ifdef"
            - text: 。
          - paragraph [ref=f3e176]: 这让 Anthropic 可以：
          - list [ref=f3e177]:
            - listitem [ref=f3e178]:
              - text: 在同一份代码库里维护外部版和内部版（
              - code [ref=f3e179]: ant
              - text: 用户）功能
            - listitem [ref=f3e180]: 通过构建标志选择性开启实验特性，不增加生产包体积
            - listitem [ref=f3e181]: 避免 feature flag 检查在运行时的开销
          - heading "React (ink) 驱动终端 UI" [level=3] [ref=f3e182]
          - paragraph [ref=f3e183]:
            - text: React 不只用于浏览器。
            - link "ink" [ref=f3e184] [cursor=pointer]:
              - /url: https://github.com/vadimdemedes/ink
            - text: 库把 React 组件渲染到命令行终端。这意味着：
          - list [ref=f3e185]:
            - listitem [ref=f3e186]: 终端里的进度条、工具调用展示、权限确认弹窗都是 React 组件
            - listitem [ref=f3e187]:
              - text: 有完整的状态管理（
              - code [ref=f3e188]: useState
              - text: ","
              - code [ref=f3e189]: useEffect
              - text: ）和生命周期
            - listitem [ref=f3e190]: UI 更新是响应式的：当工具执行状态变化，对应的 React 组件自动重渲染
          - paragraph [ref=f3e191]:
            - strong [ref=f3e192]: 与浏览器 React 的对比：
          - table [ref=f3e193]:
            - rowgroup [ref=f3e194]:
              - row [ref=f3e195]:
                - columnheader "维度" [ref=f3e196]
                - columnheader "浏览器 React" [ref=f3e197]
                - columnheader "Claude Code ink/React" [ref=f3e198]
            - rowgroup [ref=f3e199]:
              - row [ref=f3e200]:
                - cell "渲染目标" [ref=f3e201]
                - cell "DOM（HTML 元素）" [ref=f3e202]
                - cell "终端（ANSI 字符）" [ref=f3e203]
              - row [ref=f3e204]:
                - cell "布局引擎" [ref=f3e205]
                - cell "CSS Flexbox（浏览器内置）" [ref=f3e206]
                - cell [ref=f3e207]:
                  - strong [ref=f3e208]: Yoga
                  - text: （Facebook 独立 Flexbox 实现）
              - row [ref=f3e209]:
                - cell "基础组件" [ref=f3e210]
                - cell [ref=f3e211]:
                  - code [ref=f3e212]: <div>
                  - text: 、
                  - code [ref=f3e213]: <span>
                - cell [ref=f3e214]:
                  - code [ref=f3e215]: <Box>
                  - text: （≈div）、
                  - code [ref=f3e216]: <Text>
                  - text: （≈span）
              - row [ref=f3e217]:
                - cell "事件" [ref=f3e218]
                - cell "鼠标/键盘（原生 DOM）" [ref=f3e219]
                - cell "键盘/鼠标（解析 ANSI 转义序列）" [ref=f3e220]
              - row [ref=f3e221]:
                - cell "输出" [ref=f3e222]
                - cell "像素" [ref=f3e223]
                - cell "ANSI 转义码字符串" [ref=f3e224]
          - paragraph [ref=f3e225]:
            - strong [ref=f3e226]: 渲染原理（四步流水线）：
          - list [ref=f3e227]:
            - listitem [ref=f3e228]:
              - paragraph [ref=f3e229]:
                - strong [ref=f3e230]: 自定义 React Reconciler
                - text: （
                - code [ref=f3e231]: src/ink/reconciler.ts
                - text: ）：调用
                - code [ref=f3e232]: react-reconciler
                - text: 创建自定义渲染器，替换掉
                - code [ref=f3e233]: react-dom
                - text: 。React 的 diff/更新算法完全复用，只是最终"操作 DOM"变成了"操作 ink 的虚拟节点"。
            - listitem [ref=f3e234]:
              - paragraph [ref=f3e235]:
                - strong [ref=f3e236]: 虚拟节点类型
                - text: （
                - code [ref=f3e237]: src/ink/dom.ts
                - text: ）：ink 有自己的"HTML 标签"——
                - code [ref=f3e238]: ink-box
                - text: （对应
                - code [ref=f3e239]: <Box>
                - text: ）、
                - code [ref=f3e240]: ink-text
                - text: （对应
                - code [ref=f3e241]: <Text>
                - text: ）等，存在于内存的虚拟节点树里。
            - listitem [ref=f3e242]:
              - paragraph [ref=f3e243]:
                - strong [ref=f3e244]: Yoga 布局引擎
                - text: （
                - code [ref=f3e245]: src/ink/layout/yoga.ts
                - text: ）：每个
                - code [ref=f3e246]: <Box>
                - text: 节点对应一个 Yoga 节点（Meta 开源的独立 C++ Flexbox 实现，通过 native-ts 绑定调用）。Yoga 计算出每个组件的位置和尺寸，单位是"字符格"。
            - listitem [ref=f3e247]:
              - paragraph [ref=f3e248]:
                - strong [ref=f3e249]: 差量渲染到屏幕
                - text: （
                - code [ref=f3e250]: src/ink/render-node-to-output.ts
                - text: ）：渲染器把虚拟节点树遍历一遍，生成字符格矩阵（Screen），然后与上一帧 diff，只把变化的部分写入 stdout（ANSI 转义码控制光标位置和颜色）。稳定帧只更新变化的字符格 O(changed cells)，布局变动帧才全量重绘 O(rows×cols)。
          - paragraph [ref=f3e251]:
            - strong [ref=f3e252]: 整体数据流：
          - code [ref=f3e254]: React 组件（<Box>, <Text>） ↓ React Reconciler（自定义渲染器） ink 虚拟 DOM（ink-box, ink-text 节点） ↓ Yoga 布局引擎 每个节点的 (x, y, width, height) 字符坐标 ↓ render-node-to-output.ts 字符格矩阵 Screen（每格存字符+颜色+样式） ↓ writeDiffToTerminal()（差量 diff） ANSI 转义码 → stdout → 终端屏幕
          - paragraph [ref=f3e255]:
            - text: Claude Code 完全自研了这套终端渲染引擎（
            - code [ref=f3e256]: src/ink/
            - text: 目录，约 50 个文件），实现了 Flexbox 布局、鼠标事件、键盘导航、差量渲染、滚动、选中、搜索高亮、主题系统等完整特性。
          - heading "异步生成器（AsyncGenerator）作为流式管道" [level=3] [ref=f3e257]
          - paragraph [ref=f3e258]:
            - code [ref=f3e259]: query.ts
            - text: 里核心的
            - code [ref=f3e260]: query()
            - text: 函数签名：
          - code [ref=f3e262]: "export async function* query( params: QueryParams, ): AsyncGenerator< | StreamEvent | RequestStartEvent | Message | TombstoneMessage | ToolUseSummaryMessage, Terminal >"
          - paragraph [ref=f3e263]:
            - text: 它不是普通函数，而是
            - strong [ref=f3e264]: 异步生成器函数
            - text: （
            - code [ref=f3e265]: async function*
            - text: ）。调用方用
            - code [ref=f3e266]: for await (const event of query(...))
            - text: 来消费流式事件：
          - code [ref=f3e268]: "// 消费方（简化示意） for await (const event of query(params)) { if (event.type === 'assistant') { // 流式渲染 AI 回复 renderText(event.content) } else if (event.type === 'tool_result') { // 显示工具执行结果 renderToolResult(event) } }"
          - paragraph [ref=f3e269]: 这种设计的好处：
          - list [ref=f3e270]:
            - listitem [ref=f3e271]:
              - strong [ref=f3e272]: 背压控制
              - text: ：消费者来不及处理时，生产者自动暂停（yield 挂起）
            - listitem [ref=f3e273]:
              - strong [ref=f3e274]: 资源复用
              - text: ：整个智能体循环复用同一个 HTTP 连接的流式传输
            - listitem [ref=f3e275]:
              - strong [ref=f3e276]: 透明性
              - text: ：调用方不需要知道内部是单轮还是多轮——它只关心事件流
          - heading "Zod 用于运行时类型安全" [level=3] [ref=f3e277]
          - paragraph [ref=f3e278]:
            - text: 项目大量使用
            - link "Zod" [ref=f3e279] [cursor=pointer]:
              - /url: https://zod.dev/
            - text: 库定义数据 schema：
          - code [ref=f3e281]: "// 工具输入 schema 示例（GrepTool） const inputSchema = z.strictObject({ pattern: z.string().describe('The regular expression pattern'), path: z.string().optional(), output_mode: z.enum(['content', 'files_with_matches', 'count']).optional(), // ... })"
          - paragraph [ref=f3e282]: Zod 的作用：
          - list [ref=f3e283]:
            - listitem [ref=f3e284]:
              - strong [ref=f3e285]: 运行时验证
              - text: ：
              - code [ref=f3e286]: inputSchema.safeParse(aiInput)
              - text: 确保 AI 传来的参数格式正确
            - listitem [ref=f3e287]:
              - strong [ref=f3e288]: TypeScript 类型推断
              - text: ：
              - code [ref=f3e289]: z.infer<typeof inputSchema>
              - text: 自动生成 TS 类型
            - listitem [ref=f3e290]:
              - strong [ref=f3e291]: 描述即文档
              - text: ：
              - code [ref=f3e292]: .describe()
              - text: 注释会作为 tool schema 的一部分发给 AI，告诉 AI 每个参数的含义
