          - heading "1.7 本项目的不足" [level=2] [ref=f3e333]
          - list [ref=f3e334]:
            - listitem [ref=f3e335]:
              - strong [ref=f3e336]: 冷启动时间
              - text: ：即使有并行预热优化，首次启动仍需 300-500ms，在 CI 频繁调用时累积开销显著。
